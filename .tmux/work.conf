# ~/.tmux/work.conf
# Betfair work session: one window per project, each window split into
# 3 panes (1 left main pane + 2 stacked right panes).
# Load with: tmux source-file ~/.tmux/work.conf (see the `tmux-work` alias).

# Base projects directory, referenced below as #{@work_base} so it's only
# defined once; -c arguments support tmux format expansion.
set -g @work_base "/Users/diogo.cardoso/Projects/work/bf"

new-session -d -s work -n work -c "#{@work_base}"
split-window -h -p 50 -t work:0 -c "#{@work_base}"
split-window -v -p 50 -t work:0 -c "#{@work_base}"
select-pane -t work:0.0

new-window -t work:1 -n tbd -c "#{@work_base}/tbd"
split-window -h -p 50 -t work:1 -c "#{@work_base}/tbd"
split-window -v -p 50 -t work:1 -c "#{@work_base}/tbd"
select-pane -t work:1.0

new-window -t work:2 -n tbd-components -c "#{@work_base}/tbd-components"
split-window -h -p 50 -t work:2 -c "#{@work_base}/tbd-components"
split-window -v -p 50 -t work:2 -c "#{@work_base}/tbd-components"
select-pane -t work:2.0

new-window -t work:3 -n tbd-bff -c "#{@work_base}/tbd-bff"
split-window -h -p 50 -t work:3 -c "#{@work_base}/tbd-bff"
split-window -v -p 50 -t work:3 -c "#{@work_base}/tbd-bff"
select-pane -t work:3.0

select-window -t work:0
